name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SECRET_KEY: chave-usada-so-no-ci-nao-e-segredo
  APP_ENV: dev

jobs:
  postgres:
    name: Testes (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prontuario_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # NAO e o `postgres`, e essa e a questao. Superusuario do PostgreSQL
      # ATRAVESSA toda politica de Row-Level Security -- nao ha `FORCE` que o
      # alcance --, entao a suite de RLS rodava num ambiente onde o RLS nao
      # podia funcionar. O papel abaixo e criado sem SUPERUSER e sem BYPASSRLS,
      # que e a condicao em que o controle central deste sistema significa
      # alguma coisa. Ver o passo "Papel da aplicacao".
      DATABASE_URL: postgresql://prontuario_app:prontuario_app@localhost:5432/prontuario_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # O papel que a aplicacao usa em producao nao e superusuario e nao tem
      # BYPASSRLS -- `flask hardening-check` reprova se tiver. O CI precisa da
      # mesma condicao, senao a suite de RLS mede um banco onde as politicas
      # nunca se aplicam. As migrations rodam com ele, de proposito: a aplicacao
      # E a dona das tabelas, e e por isso que `FORCE ROW LEVEL SECURITY` e
      # obrigatorio.
      - name: Papel da aplicação, sem SUPERUSER e sem BYPASSRLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d prontuario_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE prontuario_app LOGIN PASSWORD 'prontuario_app'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT ALL ON DATABASE prontuario_ci TO prontuario_app;
          ALTER SCHEMA public OWNER TO prontuario_app;
          SQL

      - name: Conferir que o papel realmente não atravessa o RLS
        env:
          PGPASSWORD: prontuario_app
        run: |
          psql -h localhost -U prontuario_app -d prontuario_ci -t -A -v ON_ERROR_STOP=1 \
            -c "select rolsuper or rolbypassrls from pg_roles where rolname = current_user" \
            | grep -qx f
          echo "papel sem superuser e sem bypassrls"

      # As migrations não são exercitadas pelo pytest, que monta o schema com
      # create_all. Aplicá-las num banco vazio é o que garante que a migration
      # roda de fato — inclusive o rename de coluna, que o autogenerate erra.
      - name: Aplicar migrations num banco vazio
        run: flask --app app db upgrade

      - name: Conferir que models e schema não divergem
        run: flask --app app db check

      # `upgrade` sozinho não prova que a migration é reversível. Uma migration
      # sem downgrade funcional só se descobre no dia em que é preciso voltar —
      # e esse dia nunca é um bom dia.
      - name: Migração reversa e reaplicação
        run: |
          flask --app app db downgrade base
          flask --app app db upgrade

      - name: Testes
        run: pytest --cov=. --cov-report=term-missing:skip-covered

      # Backup e restore são a garantia de continuidade. Aqui a cópia é gerada e
      # restaurada de verdade, com conferência de contagens: sai 1 se divergir.
      - name: Backup e validação de restore
        run: |
          pg_dump --host localhost --port 5432 --username postgres \
                  --dbname prontuario_ci --format custom \
                  --no-owner --no-privileges --enable-row-security \
                  --file /tmp/ci.dump
          flask --app app backup-validar /tmp/ci.dump
        env:
          PGPASSWORD: postgres
          PGOPTIONS: -c app.nivel=SISTEMA

      # Confere no banco os controles que a aplicação não garante sozinha.
      # `continue-on-error` porque a propriedade de audit_logs depende de papel
      # dedicado, que o banco efêmero do CI não tem: o relatório aparece no log
      # sem reprovar o build por uma condição que não se aplica aqui.
      - name: Verificação de hardening (informativo)
        run: flask --app app hardening-check
        continue-on-error: true

  sqlite:
    name: Testes (SQLite)
    runs-on: ubuntu-latest
    env:
      # O projeto promete os dois bancos: SQLite em desenvolvimento, PostgreSQL
      # em produção. Rodar só um deixaria passar diferença de dialeto — que foi
      # exatamente a origem de vários defeitos aqui.
      DATABASE_URL: sqlite:///instance/ci.db
      TEST_DATABASE_URL: sqlite:///instance/ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Aplicar migrations num banco vazio
        run: flask --app app db upgrade

      - name: Testes
        run: pytest
