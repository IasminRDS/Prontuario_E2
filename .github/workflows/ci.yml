name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SECRET_KEY: chave-usada-so-no-ci-nao-e-segredo
  APP_ENV: dev

jobs:
  postgres:
    name: Testes (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prontuario_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prontuario_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # As migrations não são exercitadas pelo pytest, que monta o schema com
      # create_all. Aplicá-las num banco vazio é o que garante que a migration
      # roda de fato — inclusive o rename de coluna, que o autogenerate erra.
      - name: Aplicar migrations num banco vazio
        run: flask --app app db upgrade

      - name: Conferir que models e schema não divergem
        run: flask --app app db check

      - name: Testes
        run: pytest --cov=. --cov-report=term-missing:skip-covered

  sqlite:
    name: Testes (SQLite)
    runs-on: ubuntu-latest
    env:
      # O projeto promete os dois bancos: SQLite em desenvolvimento, PostgreSQL
      # em produção. Rodar só um deixaria passar diferença de dialeto — que foi
      # exatamente a origem de vários defeitos aqui.
      DATABASE_URL: sqlite:///instance/ci.db
      TEST_DATABASE_URL: sqlite:///instance/ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Aplicar migrations num banco vazio
        run: flask --app app db upgrade

      - name: Testes
        run: pytest
